<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新莊教保員職缺</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#1f1d1a;--muted:#6f6a61;--faint:#a29d93;--line:#e7e2d8;
  --accent:#2e6b5a;--accent-soft:#e4efe9;--accent-ink:#fff;
  --gov:#2e6b5a;--np:#3f6fa0;--qp:#7563a3;--pv:#9a9488;--cram:#a8794a;--hot:#c2522b;--new:#d99a1e;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141412;--surface:#1f1e1b;--ink:#ece8e0;--muted:#a59f94;--faint:#7a756c;--line:#34322d;
  --accent:#7cc1aa;--accent-soft:#22332d;--accent-ink:#0f1f19;
  --gov:#4f9a83;--np:#5a86b8;--qp:#8a78c0;--pv:#7d776c;--cram:#a8794a;--hot:#d9734b;--new:#eab54d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

header{padding:24px 0 4px}
header h1{font-size:24px;margin:0}
header p{margin:2px 0 0;color:var(--faint);font-size:14px}

.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px}
.tabs .wrap{display:flex;gap:6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.page{display:none;padding:8px 0 40px}
.page.on{display:block}

h2{font-size:18px;margin:26px 0 10px}
h2:first-child{margin-top:8px}
h2 small{font-weight:400;color:var(--faint);font-size:14px;margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}

/* 這週先投 */
.pick{display:block;padding:16px 18px;margin-bottom:10px}
.pick .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pick b{font-size:19px}
.pick .sal{font-weight:700;color:var(--accent);white-space:nowrap}
.pick .d{color:var(--muted);font-size:14px;margin-top:4px}
.pick .go{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;color:var(--accent)}

/* 一行一家 */
.rows{overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px}
.row summary::-webkit-details-marker{display:none}
.dot{flex:none;width:9px;height:9px;border-radius:50%}
.row .nm{flex:1;min-width:0;font-weight:600}
.row .nm small{display:block;font-weight:400;color:var(--faint);font-size:13px}
.row .sal{white-space:nowrap;font-size:15px;color:var(--muted)}
.row .chev{color:var(--faint);transition:transform .15s}
.row[open] .chev{transform:rotate(90deg)}
.jobs{list-style:none;margin:0;padding:0 16px 10px 35px}
.jobs a{display:block;padding:8px 0;border-top:1px dashed var(--line)}
.jobs a:first-child{border-top:0}
.jobs a b{font-weight:600;font-size:15px}
.jobs a small{display:block;color:var(--muted);font-size:13px}
.src{font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.tag{display:inline-block;font-size:12px;padding:0 7px;border-radius:99px;margin-left:6px;font-weight:600;line-height:1.7;vertical-align:1px}
.tag.new{background:var(--new);color:#1a1200}
.tag.hot{background:var(--hot);color:#fff}
.tag.tmp{border:1px solid var(--hot);color:var(--hot)}
.tag.est{border:1px dashed var(--faint);color:var(--muted);font-weight:400}
.tag.ok{background:var(--accent-soft);color:var(--accent)}

.morebtn{display:block;width:100%;margin-top:10px;padding:13px;border:1px dashed var(--line);border-radius:14px;background:none;color:var(--muted);font-size:15px;cursor:pointer}
.live{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.live a{text-align:center;padding:11px;font-size:15px;font-weight:600}
.live a small{display:block;font-weight:400;font-size:12px;color:var(--faint)}

/* 考試日程 */
.next{padding:16px 18px;border-left:5px solid var(--hot)}
.next .k{font-size:13px;color:var(--hot);font-weight:700}
.next b{font-size:19px;display:block;margin:2px 0}
.next span{color:var(--muted);font-size:15px}
.tl{padding:12px 10px 8px;overflow-x:auto;margin-top:10px}
.tl table{border-collapse:collapse;width:100%;min-width:540px;font-size:13px}
.tl th{font-weight:600;color:var(--faint);padding:2px 0 6px;text-align:center;vertical-align:bottom}
.tl th:first-child{width:84px}
.tl td{padding:4px 1px;height:30px}
.tl td.lbl{font-weight:600;padding-right:6px;white-space:nowrap}
.tl .now{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tl th.now{color:var(--ink);border-radius:6px 6px 0 0}
.tl th.now span{display:block;font-size:11px;color:var(--accent);font-weight:700;line-height:1.2}
.bar{height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.bar.reg{background:color-mix(in srgb,var(--c) 20%,var(--surface))!important;color:var(--c)}
.bar.est{outline:1.5px dashed color-mix(in srgb,var(--c) 70%,var(--ink));outline-offset:-1.5px}
.legend{color:var(--faint);font-size:13px;margin:8px 2px 0}
.ex summary .when{font-size:13px;color:var(--faint);font-weight:400}
.ex dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;padding:0 16px 14px 35px;font-size:15px}
.ex dt{color:var(--muted)}
.ex dd{margin:0}
.ex .foot{padding:0 16px 14px 35px;font-size:13px;color:var(--faint)}
.ex .foot a{text-decoration:underline}
.sch{list-style:none;margin:0;padding:0 16px 12px 35px}
.sch li{padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
.sch li span{color:var(--faint);font-size:13px;margin-left:6px}
.sch a{display:block;font-size:13px;color:var(--muted);text-decoration:underline}

/* 進度 */
.prog{padding:18px;margin-top:8px;background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.prog .k{font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.prog b{display:block;font-size:21px;margin:4px 0 2px}
.prog .sub{color:var(--muted);font-size:14px}
.bigbar{height:12px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);margin:14px 0 6px;overflow:hidden}
.bigbar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s}
.prog .pct{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.steps2{list-style:none;margin:18px 0 0;padding:0}
.steps2>li{position:relative;padding:0 0 18px 46px}
.steps2>li::before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--line)}
.steps2>li.done::before{background:var(--accent)}
.steps2>li:last-child::before{display:none}
.steps2 .n{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface);border:2px solid var(--line);color:var(--faint)}
.steps2 .done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps2 .cur .n{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.steps2 .h{display:flex;align-items:center;gap:8px;min-height:32px;font-weight:700;font-size:17px}
.steps2 .todo .h{color:var(--faint);font-weight:600}
.steps2 .h .badge{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.steps2 .s{color:var(--muted);font-size:14px}
.steps2 .todo .s{color:var(--faint)}
.box{margin-top:10px;padding:12px 14px}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px}
.chk .c{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;margin-top:2px}
.chk .y .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk em{font-style:normal}
.chk .y em{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.chk .nx em{font-weight:700}
.chk small{display:block;color:var(--faint);font-size:12px;text-decoration:none}
.minibar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden;margin:8px 0 4px}
.minibar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cj{margin-top:8px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.cj small{display:block;color:var(--muted);font-size:12px}
.prep{margin-top:10px;padding:0 14px}
.prep summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 0;font-weight:700;font-size:15px}
.prep summary::-webkit-details-marker{display:none}
.prep summary small{font-weight:400;color:var(--faint);font-size:13px;flex:1}
.prep[open] .chev{transform:rotate(90deg)}
.prep .chev{color:var(--faint);transition:transform .15s}
.pw{font-size:13px;font-weight:700;color:var(--accent);margin:4px 0 0}
.prep .chk{padding-bottom:6px}
.bonus{font-size:13px;color:var(--muted);margin-top:8px}
/* 路線 */
.steps{list-style:none;margin:8px 0 0;padding:0}
.steps li{position:relative;padding:0 0 22px 44px}
.steps li::before{content:"";position:absolute;left:14px;top:32px;bottom:4px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .n{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.steps li.cur .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps b{display:block;font-size:17px}
.steps span{color:var(--muted);font-size:15px}
.here{font-size:13px;color:var(--accent);margin-left:8px}
.note{padding:14px 16px;font-size:15px;color:var(--muted)}

footer{color:var(--faint);font-size:12px;padding:8px 0 40px}
</style>
</head>
<body>
<header class="wrap">
  <h1>新莊區 教保員職缺</h1>
  <p id="upd">&nbsp;</p>
</header>

<div class="tabs"><div class="wrap">
  <button data-p="jobs" class="on">找工作</button>
  <button data-p="exams">考試日程</button>
  <button data-p="path">當上公幼老師</button>
</div></div>

<main class="wrap">

<section class="page on" id="jobs">
  <h2>這週先投 <small id="snapdate"></small></h2>
  <div id="picks"></div>
  <h2>其他推薦 <small>非營利・準公共</small></h2>
  <div class="card rows" id="rec"></div>
  <button class="morebtn" id="morebtn"></button>
  <div id="rest" hidden>
    <h2>其他幼兒園</h2>
    <div class="card rows" id="others"></div>
  </div>
  <div class="live">
    <a class="card" href="https://www.104.com.tw/jobs/search/?jobcat=2016002020&area=6001002021&ro=1&order=15" target="_blank" rel="noopener">104 最新<small>新莊・教保員</small></a>
    <a class="card" href="https://www.1111.com.tw/search/job?c0=100221&ks=%E6%95%99%E4%BF%9D%E5%93%A1&col=ab&sort=desc" target="_blank" rel="noopener">1111 最新<small>新莊・教保員</small></a>
  </div>
</section>

<section class="page" id="exams">
  <div class="card next" id="next"></div>
  <div class="card tl" id="tl"></div>
  <p class="legend">淺色＝簡章／報名／放榜　深色「考」＝考試　虛線＝預估</p>
  <h2>各考試日期 <small>點開看細節</small></h2>
  <div class="card rows" id="exlist"></div>
  <h2>相關公告</h2>
  <div class="card rows" id="notes"></div>
</section>

<section class="page" id="path">
  <div class="card prog" id="prog"></div>
  <ol class="steps2" id="steps"></ol>
  <div class="card note">年資只算<b>幼兒園</b>的<b>專任、月薪</b>教保員，累計滿 3 年（不必連續）。托嬰中心、助理教保員、時薪、兼職都不算。<br><br><b>上班後記得確認</b>：園方有把她列進報給新北市教育局的「教職員工名冊」，年資以名冊為準。<br><br><small>出處：<a href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=H0050013" target="_blank" rel="noopener" style="text-decoration:underline">幼兒園在職人員修習幼兒園教師師資職前教育課程辦法 第 2 條</a></small></div>
</section>

<footer id="foot"></footer>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
const thisMonth=+today.slice(5,7);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const mdd=d=>`${+d.slice(5,7)}/${+d.slice(8,10)}`;

/* 分頁 */
function show(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===p));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  history.replaceState(null,'','#'+p); window.scrollTo(0,0);
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) show(b.dataset.p);});
if(['jobs','exams','path'].includes(location.hash.slice(1))) show(location.hash.slice(1));

/* ---------- 找工作 ---------- */
const KINDS=[
  {id:1,name:'公立',color:'var(--gov)',re:/市立|縣立|國立|附設|公立|公幼/},
  {id:2,name:'非營利',color:'var(--np)',re:/非營利|三之三/},
  {id:3,name:'準公共',color:'var(--qp)',re:/準公共|育全保安|育誠/},
  {id:5,name:'美語體系',color:'var(--cram)',re:/補習班|美語|吉的堡|何嘉仁|奇異鳥|惠文|邦仁|WeKIDS|文笙|吉尼爾/i},
  {id:4,name:'私立',color:'var(--pv)',re:/./},
];
const kindOf=t=>KINDS.find(k=>k.re.test(t));
const schoolKey=i=>(i.school||i.org||'').replace(/^新北市(私立|立)?/,'').replace(/\s/g,'');
const isTemp=i=>/代理|代課/.test((i.title||'')+(i.tags||[]).join()+(i.note||''));
const salNums=s=>(String(s||'').replace(/,/g,'').match(/\d{5}/g)||[]).map(Number);
const fmt=n=>n.toLocaleString('en-US');

function groups(items){
  const m=new Map();
  for(const i of items){const k=schoolKey(i); if(!m.has(k)) m.set(k,{name:k,items:[]}); m.get(k).items.push(i);}
  return [...m.values()].map(g=>{
    const nums=g.items.flatMap(i=>salNums(i.salary)), lo=Math.min(...nums), hi=Math.max(...nums);
    const dl=g.items.map(i=>i.deadline).filter(d=>d&&d>=today).sort()[0];
    const fresh=g.items.some(i=>!i.manual&&i.first_seen&&days(i.first_seen,today)<=3);
    return {...g,kind:kindOf(g.items.map(i=>[i.school,i.org,i.title,i.note].join(' ')).join(' ')),dl,fresh,
      sal:nums.length?(lo===hi?fmt(lo):`${fmt(lo)}–${fmt(hi)}`):'薪資面議',
      place:(g.items.find(i=>i.place&&!/^(新莊|新北市-新莊區.*)$/.test(i.place))?.place||'').replace(/^新北市新莊區/,'')};
  }).sort((a,b)=>a.kind.id-b.kind.id||((a.dl||'9')>(b.dl||'9')?1:-1));
}
function rowHTML(g){
  const t=[];
  if(g.fresh) t.push('<span class="tag new">新</span>');
  if(g.dl){const d=days(today,g.dl); t.push(`<span class="tag ${d<=3?'hot':'est'}">${d<=3?`剩 ${d} 天`:mdd(g.dl)+' 截止'}</span>`);}
  const jobs=g.items.map(i=>{
    const sub=[i.salary,i.exam_date&&`甄試 ${mdd(i.exam_date)}`,i.note].filter(Boolean).map(esc).join('・');
    return `<a href="${esc(i.url)}" target="_blank" rel="noopener"><b><span class="src">${esc(i.source)}</span>${esc(i.title)}${isTemp(i)?'<span class="tag tmp">代理</span>':''}</b><small>${sub}</small></a>`;
  }).join('');
  return `<details class="row"><summary><span class="dot" style="background:${g.kind.color}"></span><span class="nm">${esc(g.name)}${t.join('')}<small>${g.kind.name}${g.place?'・'+esc(g.place):''}</small></span><span class="sal">${g.sal}</span><span class="chev">›</span></summary><div class="jobs">${jobs}</div></details>`;
}

Promise.all([
  fetch('data.json?'+Date.now()).then(r=>r.json()).catch(()=>({items:[]})),
  fetch('snapshot.json?'+Date.now()).then(r=>r.json()).catch(()=>({items:[]})),
]).then(([d,s])=>{
  $('upd').textContent=`每天早上自動更新・最後更新 ${(d.updated_at||'').slice(5).replace('-','/')}`;
  if(s.taken_at)$('snapdate').textContent=`104 人工整理・${s.taken_at.slice(5).replace('-','/')}，不會每天自動換`;
  const snap=s.items.map(i=>({...i,manual:true}));
  const picks=snap.filter(i=>i.pick);
  const pickSchools=new Set(picks.map(schoolKey));
  $('picks').innerHTML=picks.map(i=>{
    const k=kindOf([i.school,i.org,i.title,i.note].join(' '));
    const sal=salNums(i.salary); const salTxt=sal.length?(sal.length>1?`${fmt(sal[0])}–${fmt(sal[1])}`:`${fmt(sal[0])} 起`):'';
    const d=(i.note||'').split('；')[0].replace(/^非營利幼兒園$|^準公共$/,'')||i.place||'';
    return `<a class="card pick" href="${esc(i.url)}" target="_blank" rel="noopener"><div class="r"><b>${esc(i.school)}</b><span class="sal">${salTxt}</span></div>
      <div class="d"><span class="dot" style="display:inline-block;background:${k.color};margin-right:6px"></span>${k.name}・${esc(d)}${/寫明/.test(i.note||'')?'・應徵時寫明「教保員」':''}</div><span class="go">去 ${esc(i.source)} 應徵 ›</span></a>`;
  }).join('');
  const gs=groups([...d.items,...snap]).filter(g=>!pickSchools.has(g.name));
  const rec=gs.filter(g=>g.kind.id<=3), rest=gs.filter(g=>g.kind.id>3);
  $('rec').innerHTML=rec.map(rowHTML).join('')||'<p class="note">目前沒有。</p>';
  $('others').innerHTML=rest.map(rowHTML).join('');
  $('morebtn').textContent=`看其他 ${rest.length} 家私立幼兒園`;
  $('morebtn').onclick=()=>{$('rest').hidden=false;$('morebtn').hidden=true;};
  $('foot').textContent=`資料：教育部幼兒園人才庫、518、新北市幼教網每天自動更新；104、1111 為 ${s.taken_at||''} 人工整理，最新請按「104／1111 最新」。`;
  const notes=d.notices||[];
  $('notes').innerHTML=notes.length?notes.map(n=>`<details class="row"><summary><span class="dot" style="background:var(--faint)"></span><span class="nm" style="font-weight:400;font-size:15px">${esc(n.title)}</span><span class="chev">›</span></summary><div class="jobs"><a href="${esc(n.url)}" target="_blank" rel="noopener"><b>開啟公告</b></a></div></details>`).join(''):'<p class="note">目前沒有相關公告。</p>';
});

/* ---------- 考試日程 ---------- */
const EXAMS=[
  {id:'kg_staff',name:'公幼契約教保員甄選',short:'公幼教保員',color:'var(--gov)',when:'明年就能考'},
  {id:'program',name:'幼教專班',short:'幼教專班',color:'var(--qp)',when:'教保員滿 3 年後'},
  {id:'qualify',name:'教師資格考試（教檢）',short:'教檢',color:'var(--np)',when:'修完幼教專班後'},
  {id:'teacher_hire',name:'幼兒園教師甄選（教甄）',short:'教甄',color:'var(--hot)',when:'最後一關'},
];
const KL={exam:'考',register:'報名',notice:'簡章',result:'榜'}, KR={exam:4,register:3,notice:2,result:1};
const rng=e=>e.end?`${mdd(e.start)}–${mdd(e.end)}`:mdd(e.start);
const clean=l=>l.replace(/時間$/,'').replace(/網路/,'');
Promise.all([
  fetch('exams.json?'+Date.now()).then(r=>r.json()).catch(()=>({})),
  fetch('programs.json?'+Date.now()).then(r=>r.json()).catch(()=>({})),
]).then(([X,P])=>{
  const up={...(X.upcoming||{}),program:P.upcoming};
  const M=[...Array(12)].map((_,i)=>i+1);
  let h='<table><tr><th></th>'+M.map(m=>m===thisMonth?`<th class="now"><span>現在</span>${m}月</th>`:`<th>${m}月</th>`).join('')+'</tr>';
  for(const e of EXAMS){
    const cell={};
    for(const v of up[e.id]?.events||[]){
      for(let m=+v.start.slice(5,7);m<=+(v.end||v.start).slice(5,7);m++){const c=cell[m]; if(!c||KR[v.kind]>KR[c.kind]) cell[m]=v;}
    }
    h+=`<tr><td class="lbl">${e.short}</td>`+M.map(m=>{const c=cell[m];
      return `<td class="${m===thisMonth?'now':''}">${c?`<div class="bar${c.kind==='exam'?'':' reg'}${c.est?' est':''}" style="--c:${e.color};background:${e.color}">${KL[c.kind]}</div>`:''}</td>`;}).join('')+'</tr>';
  }
  $('tl').innerHTML=h+'</table>';

  $('exlist').innerHTML=EXAMS.map(e=>{
    const u=up[e.id]; if(!u?.events?.length) return '';
    const est=u.events.some(v=>v.est);
    const main=u.events.find(v=>v.kind==='exam')||u.events.find(v=>v.kind==='register');
    const dl=u.events.filter(v=>!/繳費/.test(v.label)).map(v=>`<dt>${esc(clean(v.label))}</dt><dd>${u.year+1911}/${rng(v)}${v.est?'<span class="tag est">預估</span>':''}</dd>`).join('');
    let extra='';
    if(e.id==='program'&&P.schools?.length){
      extra=`<div class="foot">開班學校（已確認 ${P.schools.length} 校，教育部每年核定）</div><ul class="sch">${P.schools.map(x=>`<li>${esc(x.name)}<span>${esc(x.area)}${x.latest_year?'・'+x.latest_year+' 學年度':''}</span>${x.items?.[0]?`<a href="${esc(x.items[0].url)}" target="_blank" rel="noopener">${esc(x.items[0].title)}</a>`:`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.note||'學校公告頁')}</a>`}</li>`).join('')}</ul>`;
    }
    return `<details class="row ex"><summary><span class="dot" style="background:${e.color}"></span><span class="nm">${e.name}<small>${main?`${u.year+1911}/${rng(main)} ${main.kind==='exam'?'考試':'報名'}${main.est?'（預估）':''}`:''}・${e.when}</small></span><span class="chev">›</span></summary>
      <dl>${dl}</dl><div class="foot">${est?'標「預估」的是用去年日期推算，官方公告後自動更新。':'官方已公告。'}${u.source?` <a href="${esc(u.source)}" target="_blank" rel="noopener">來源</a>`:''}</div>${extra}</details>`;
  }).join('');

  const nx=(up.kg_staff?.events||[]).find(v=>(v.end||v.start)>=today);
  if(nx){
    const left=Math.max(0,Math.round(days(today,nx.start)/30));
    $('next').innerHTML=`<div class="k">下一步</div><b>公幼契約教保員甄選</b><span>${nx.est?'約 ':''}${nx.start.slice(0,4)}/${mdd(nx.start)} ${esc(clean(nx.label))}${nx.est?'（預估）':''}，${left?`還有約 ${left} 個月`:'就在這個月'}。行事曆已設提醒。</span>`;
  }
});

/* ---------- 當上公幼老師：進度 ---------- */
fetch('progress.json?'+Date.now()).then(r=>r.json()).then(G=>{
  const tasks=G.tasks||[], nDone=tasks.filter(t=>t.done).length;
  const start=G.job_start, months=start?Math.max(0,Math.min(36,(new Date(today)-new Date(start))/(864e5*30.44))):0;
  const step1Done=nDone===tasks.length;
  const cur=!step1Done?1:months<36?2:3;
  const nextTask=tasks.find(t=>!t.done);
  // 總進度：第1步佔15%，第2步(年資)佔45%，後面四步各10%
  const pct=Math.round((step1Done?15:15*nDone/tasks.length)+45*months/36);
  const chk=(list)=>`<ul class="chk">${list.map(t=>`<li class="${t.done?'y':t===nextTask?'nx':''}"><span class="c">${t.done?'✓':''}</span><span><em>${esc(t.text)}</em>${t.done?`<small>${mdd(t.done)} 完成</small>`:t===nextTask?'<small>下一件事</small>':''}</span></li>`).join('')}</ul>`;
  const yrs=`${Math.floor(months)} / 36 個月`;
  const prepHTML=P=>!P?.length?'':`<details class="card prep"><summary>準備清單<small>${P.flatMap(g=>g.items).filter(i=>i.done).length} / ${P.flatMap(g=>g.items).length}</small><span class="chev">›</span></summary>${P.map(g=>`<div class="pw">${esc(g.when)}</div><ul class="chk">${g.items.map(t=>`<li class="${t.done?'y':''}"><span class="c">${t.done?'✓':''}</span><span><em>${esc(t.text)}</em></span></li>`).join('')}</ul>`).join('')}</details>`;
  const S=[
    {h:'找到教保員工作',s:`${nDone} / ${tasks.length} 完成`,body:`${G.current_job?`<div class="cj">目前：${esc(G.current_job.text)}<small>${esc(G.current_job.note)}</small></div>`:''}<div class="card box">${chk(tasks)}</div>${prepHTML(G.prep)}`},
    {h:'累積滿 3 年年資（不必連續）',s:start?`${mdd(start)} 到職・${yrs}`:'到職那天開始自動計算',body:`<div class="minibar"><i style="width:${months/36*100}%"></i></div><div class="s">${start?`預計 ${new Date(new Date(start).getTime()+36*30.44*864e5).toISOString().slice(0,7).replace('-','/')} 滿 3 年`:'0 / 36 個月'}</div>${(G.bonus||[]).map(b=>`<div class="bonus">加分選項：${esc(b.text)}${b.done?' ✓':''}</div>`).join('')}`},
    {h:'報名幼教專班',s:'約 18 學分，每年 5 月報名'},
    {h:'考教師資格考試（教檢）',s:'每年 6 月'},
    {h:'教育實習半年',s:'最近 7 年內累計教學滿 3 年（不必連續）、表現優良，可申請免修'},
    {h:'考幼兒園教師甄選（教甄）',s:'每年 5 月初試 → 正式公幼老師 🎉'},
  ];
  $('steps').innerHTML=S.map((x,i)=>{const n=i+1, st=n<cur?'done':n===cur?'cur':'todo';
    return `<li class="${st}"><span class="n">${st==='done'?'✓':n}</span><div class="h">${x.h}${st==='cur'?'<span class="badge">進行中</span>':''}</div><div class="s">${x.s}</div>${st==='todo'?'':(x.body||'')}</li>`;}).join('');
  const curS=S[cur-1];
  $('prog').innerHTML=`<div class="k"><span class="pulse"></span>進行中・第 ${cur} / ${S.length} 步</div><b>${curS.h}</b>
    <div class="sub">${nextTask&&cur===1?`下一件事：${esc(nextTask.text)}`:curS.s}</div>
    <div class="bigbar"><i style="width:${Math.max(pct,3)}%"></i></div><div class="pct"><span>起點</span><span>${pct}%</span><span>正式公幼老師</span></div>`;
});
</script>
</body>
</html>
