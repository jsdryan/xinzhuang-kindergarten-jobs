name: 每日更新職缺

# 每日更新改由家裡 NAS 的 nas-collector 執行（人才庫擋國外 IP）；這裡只留手動備援。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scraper/fetch_jobs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "每日更新職缺 $(TZ=Asia/Taipei date +%F)" || echo "no changes"
          git push
